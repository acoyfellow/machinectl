name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm install
        working-directory: examples/cloudflare-worker-relay
      - run: npm test
        working-directory: examples/cloudflare-worker-relay
      - run: npm install
        working-directory: examples/codemode-control
      - run: npm test
        working-directory: examples/codemode-control
